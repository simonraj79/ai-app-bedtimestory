<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chat">
    <title>Chat — AI Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back" href="index.html">&larr; All apps</a>
    <h1>💬 Chat</h1>

    <div class="authbar">
        <div id="g-signin"></div>
        <span id="auth-hint" class="auth-hint">Sign in with Google to ask a question.</span>
        <span id="auth-who" class="auth-who" hidden></span>
        <button type="button" id="signout" class="signout" hidden>Sign out</button>
    </div>

    <textarea id="question" rows="3" placeholder="Ask a question…" enterkeyhint="send"></textarea>
    <!-- Starts disabled: the page ships in the signed-out state, and the form
         stays visible because a hidden form reads as a broken page. -->
    <button id="ask-btn" class="primary" disabled>Ask</button>

    <div id="answer" aria-live="polite"></div>
    <div id="error" role="alert"></div>

    <h2>Recent</h2>
    <ol id="history"><li class="empty">No questions yet.</li></ol>

    <script src="config.js"></script>
    <script>
    function renderHistory(items) {
      const list = document.getElementById("history");
      if (!items || items.length === 0) {
        list.innerHTML = '<li class="empty">No questions yet.</li>';
        return;
      }
      list.innerHTML = items.map(it => `
        <li><details>
          <summary>
            <span class="q">${escapeHtml(it.question)}</span>
            <span class="meta">${escapeHtml(it.created_at)}</span>
          </summary>
          <div class="a">${escapeHtml(it.answer)}</div>
        </details></li>`).join("");
    }

    // /history is per-user and authenticated, so there is nothing to fetch until
    // someone is signed in - and asking anyway would just be a 401.
    async function loadHistory() {
      const headers = authHeaders();
      if (!headers) return;
      try {
        const r = await fetch(`${BACKEND_URL}/history`, {headers});
        if (r.status === 401) return handleAuthExpired(document.getElementById("error"));
        if (r.ok) renderHistory(await r.json());
      } catch (e) {
        document.getElementById("error").textContent =
          `Cannot reach the backend at ${BACKEND_URL}.`;
      }
    }

    document.getElementById("ask-btn").addEventListener("click", async () => {
      const btn = document.getElementById("ask-btn");
      const errEl = document.getElementById("error");
      const ansEl = document.getElementById("answer");
      errEl.textContent = "";

      const headers = authHeaders();
      if (!headers) return handleAuthExpired(errEl);

      ansEl.textContent = "Thinking…";
      btn.disabled = true;
      try {
        const r = await fetch(`${BACKEND_URL}/ask`, {
          method: "POST",
          headers,
          body: JSON.stringify({question: document.getElementById("question").value}),
        });
        if (r.status === 401) {
          ansEl.textContent = "";
          return handleAuthExpired(errEl);
        }
        const data = await r.json();
        // 429 and 502 arrive as {"detail": "..."} already written for a person;
        // pass them through rather than inventing our own wording.
        if (!r.ok) throw new Error(data.detail || "Request failed");
        ansEl.textContent = data.answer;
        renderHistory(data.history);
      } catch (e) {
        ansEl.textContent = "";
        errEl.textContent = e.message === "Failed to fetch"
          ? `Cannot reach the backend at ${BACKEND_URL}. Check it is running and that this origin is allowed by CORS.`
          : e.message;
      } finally {
        // Not plain `false`: a 401 above signed us out, and re-enabling the
        // button would offer a request that cannot succeed.
        btn.disabled = !getToken();
      }
    });

    const hintEl = document.getElementById("auth-hint");
    const whoEl = document.getElementById("auth-who");
    const signoutBtn = document.getElementById("signout");
    const buttonEl = document.getElementById("g-signin");

    initGoogleAuth({
      buttonEl,
      onSignIn: user => {
        whoEl.textContent = `Signed in as ${user.name || user.email}`;
        whoEl.hidden = false;
        signoutBtn.hidden = false;
        hintEl.hidden = true;
        buttonEl.hidden = true;
        document.getElementById("ask-btn").disabled = false;
        loadHistory();
      },
      onSignOut: () => {
        whoEl.hidden = true;
        signoutBtn.hidden = true;
        hintEl.hidden = false;
        buttonEl.hidden = false;
        document.getElementById("ask-btn").disabled = true;
        // The answer and the history belong to one person, so they go when
        // that person does - the next signer-in must not read them.
        document.getElementById("answer").textContent = "";
        renderHistory([]);
      },
    });
    signoutBtn.addEventListener("click", signOut);
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer
            onload="googleLibraryLoaded()" onerror="googleLibraryFailed()"></script>
</body>
</html>
