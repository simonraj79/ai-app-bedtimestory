<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chat">
    <title>Chat — AI Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back" href="index.html">&larr; All apps</a>
    <h1>💬 Chat</h1>

    <textarea id="question" rows="3" placeholder="Ask a question…" enterkeyhint="send"></textarea>
    <button id="ask-btn" class="primary">Ask</button>

    <div id="answer" aria-live="polite"></div>
    <div id="error" role="alert"></div>

    <h2>Recent</h2>
    <ol id="history"><li class="empty">No questions yet.</li></ol>

    <script src="config.js"></script>
    <script>
    function renderHistory(items) {
      const list = document.getElementById("history");
      if (!items || items.length === 0) {
        list.innerHTML = '<li class="empty">No questions yet.</li>';
        return;
      }
      list.innerHTML = items.map(it => `
        <li><details>
          <summary>
            <span class="q">${escapeHtml(it.question)}</span>
            <span class="meta">${escapeHtml(it.created_at)}</span>
          </summary>
          <div class="a">${escapeHtml(it.answer)}</div>
        </details></li>`).join("");
    }

    async function loadHistory() {
      try {
        const r = await fetch(`${BACKEND_URL}/history`);
        if (r.ok) renderHistory(await r.json());
      } catch (e) {
        document.getElementById("error").textContent =
          `Cannot reach the backend at ${BACKEND_URL}.`;
      }
    }

    document.getElementById("ask-btn").addEventListener("click", async () => {
      const btn = document.getElementById("ask-btn");
      const errEl = document.getElementById("error");
      const ansEl = document.getElementById("answer");
      errEl.textContent = "";
      ansEl.textContent = "Thinking…";
      btn.disabled = true;
      try {
        const r = await fetch(`${BACKEND_URL}/ask`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question: document.getElementById("question").value}),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Request failed");
        ansEl.textContent = data.answer;
        renderHistory(data.history);
      } catch (e) {
        ansEl.textContent = "";
        errEl.textContent = e.message === "Failed to fetch"
          ? `Cannot reach the backend at ${BACKEND_URL}. Check it is running and that this origin is allowed by CORS.`
          : e.message;
      } finally {
        btn.disabled = false;
      }
    });

    loadHistory();
    </script>
</body>
</html>
