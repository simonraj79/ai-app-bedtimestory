<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Apps">
    <title>AI Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="authbar">
        <div id="g-signin"></div>
        <span id="auth-hint" class="auth-hint">Sign in with Google to use the apps.</span>
        <span id="auth-who" class="auth-who" hidden></span>
        <button type="button" id="signout" class="signout" hidden>Sign out</button>
    </div>

    <h1>AI Apps</h1>
    <p class="lede">Two single-turn apps. One question in, one answer out.</p>

    <div class="apps">
        <a class="app-card" href="chat.html">
            <span class="icon">💬</span>
            <span class="name">Chat</span>
            <span class="desc">Ask a question, get a short answer. Every exchange is saved.</span>
        </a>

        <a class="app-card" href="story.html">
            <span class="icon">🌙</span>
            <span class="name">Bedtime Story</span>
            <span class="desc">A gentle story built around your child's name and a theme.</span>
        </a>
    </div>

    <p id="status" class="status"></p>

    <script src="config.js"></script>
    <script>
    const hintEl = document.getElementById("auth-hint");
    const whoEl = document.getElementById("auth-who");
    const signoutBtn = document.getElementById("signout");
    const buttonEl = document.getElementById("g-signin");

    initGoogleAuth({
      buttonEl,
      onSignIn: user => {
        whoEl.textContent = `Signed in as ${user.name || user.email}`;
        whoEl.hidden = false;
        signoutBtn.hidden = false;
        hintEl.hidden = true;
        buttonEl.hidden = true;
      },
      onSignOut: () => {
        whoEl.hidden = true;
        signoutBtn.hidden = true;
        hintEl.hidden = false;
        buttonEl.hidden = false;
      },
    });
    signoutBtn.addEventListener("click", signOut);

    // Surfaces a dead or sleeping backend here, rather than as a confusing
    // "Failed to fetch" the first time someone presses a button. /healthz is
    // deliberately unauthenticated, so this runs signed out too.
    fetch(`${BACKEND_URL}/healthz`)
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById("status");
        if (d.gemini && d.postgres) return;
        el.textContent = `Backend degraded — gemini: ${d.gemini}, postgres: ${d.postgres}`;
      })
      .catch(() => {
        document.getElementById("status").textContent =
          `Cannot reach the backend at ${BACKEND_URL}. If it is on Render's free tier it may be waking up — wait 30-60s and reload.`;
      });
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer
            onload="googleLibraryLoaded()" onerror="googleLibraryFailed()"></script>
</body>
</html>
