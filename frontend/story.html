<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#131a2c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bedtime">
    <title>Bedtime Story</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bedtime">
    <a class="back" href="index.html">&larr; All apps</a>
    <h1>🌙 Bedtime Story</h1>

    <div class="authbar">
        <div id="g-signin"></div>
        <!-- "create and read", not "hear": nothing here speaks. The app writes a
             story and a grown-up reads it aloud, and promising a voice the app
             does not have is the kind of small lie a tired reader notices. -->
        <span id="auth-hint" class="auth-hint">Sign in with Google to create and read a story.</span>
        <!-- In the auth bar, not under the history: it is one person's own
             numbers, so it belongs beside their name. Below the history it sat
             after ten collapsed stories - off the bottom of a phone, and styled
             so quietly that nobody found it.
             First in the bar, not last: at 358px the bar wraps to three rows,
             and whichever item is last starts the page below two others. -->
        <a id="mystats-link" class="mystats-link" href="mystats.html" hidden>📖 Your story stats</a>
        <span id="auth-who" class="auth-who" hidden></span>
        <button type="button" id="signout" class="signout" hidden>Sign out</button>
    </div>

    <label for="child-name">Who is the story for?</label>
    <input id="child-name" type="text" placeholder="Maya"
           autocapitalize="words" autocorrect="off" spellcheck="false"
           enterkeyhint="next" autocomplete="off">

    <label for="theme">What should it be about?</label>
    <input id="theme" type="text" placeholder="a sleepy dragon who lost his slippers"
           enterkeyhint="go" autocomplete="off">
    <div class="chips" id="chips"></div>

    <label for="length-group">How long?</label>
    <div class="segmented" id="length-group" role="group" aria-label="Story length">
        <button type="button" data-length="short"  aria-pressed="false">Short</button>
        <button type="button" data-length="medium" aria-pressed="true">Just right</button>
        <button type="button" data-length="long"   aria-pressed="false">Longer</button>
    </div>

    <!-- Starts disabled: the page ships in the signed-out state, and the form
         stays visible because a hidden form reads as a broken page. -->
    <button id="tell-btn" class="primary" disabled>Tell me a story</button>

    <div id="answer" aria-live="polite"></div>
    <div id="error" role="alert"></div>

    <h2>Earlier stories</h2>
    <!-- Hidden until there are at least two stories with stats to summarise:
         an "average" of one story is that story, wearing a bigger word. -->
    <p id="history-summary" class="hist-summary" hidden></p>
    <ol id="history"><li class="empty">No stories yet.</li></ol>

    <script src="config.js"></script>
    <script>
    const THEMES = [
      "a sleepy dragon who lost his slippers",
      "a little turtle carrying a lantern",
      "a cloud that collects lost balloons",
      "a fox who tucks in the forest",
      "a star that came down to say goodnight",
      "a rabbit with a very soft blanket",
      "a whale singing the moon to sleep",
      "a train that only runs at bedtime",
    ];

    const WRITING_LINES = [
      "Dimming the lights",
      "Finding the right words",
      "Tucking everyone in",
      "Almost ready",
    ];

    const $ = id => document.getElementById(id);
    const nameEl = $("child-name"), themeEl = $("theme");
    const btn = $("tell-btn"), ansEl = $("answer"), errEl = $("error");

    let length = localStorage.getItem("length") || "medium";
    let storySize = parseFloat(localStorage.getItem("storySize")) || 1.15;
    document.documentElement.style.setProperty("--story-size", storySize + "rem");

    // --- Suggestions: one tap beats inventing a theme at bedtime -------------
    $("chips").innerHTML = THEMES
      .map(t => `<button type="button" class="chip">${escapeHtml(t)}</button>`).join("");
    $("chips").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (chip) { themeEl.value = chip.textContent; errEl.textContent = ""; }
    });

    // --- Length -------------------------------------------------------------
    function paintLength() {
      for (const b of $("length-group").children) {
        b.setAttribute("aria-pressed", String(b.dataset.length === length));
      }
    }
    $("length-group").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      length = b.dataset.length;
      localStorage.setItem("length", length);
      paintLength();
    });
    paintLength();

    // --- Remember the child's name so it isn't retyped every night ----------
    nameEl.value = localStorage.getItem("childName") || "";
    nameEl.addEventListener("change", () =>
      localStorage.setItem("childName", nameEl.value.trim()));

    // Enter submits, which is what the phone keyboard's Go key implies. The
    // button's own state is the gate, or Enter would bypass the signed-out lock.
    for (const el of [nameEl, themeEl]) {
      el.addEventListener("keydown", e => { if (e.key === "Enter" && !btn.disabled) tell(); });
    }

    // --- History: collapsed, or ten full stories bury the page --------------
    //
    // Every stat can be null - stories written before the numbers existed have
    // none, and never will. Anywhere they are missing this omits them rather
    // than printing dashes: an older story should read as ordinary, not as one
    // that failed to load.
    //
    // `typeof x === "number"` throughout, not a truthy test: a 0-word story and
    // a negative grade are both real values that a truthy test would silently
    // drop into the "no stats" branch.
    function renderHistory(items) {
      const list = $("history");
      const rows = items || [];

      // The summary describes the rows on this page, and only the ones that
      // carry stats. It must never sound like it covers everything ever made -
      // that is a larger number, and nothing here has it.
      const counted = rows.filter(it => typeof it.word_count === "number");
      const summaryEl = $("history-summary");
      summaryEl.hidden = counted.length < 2;
      if (counted.length >= 2) {
        const skipped = rows.length - counted.length;
        const words = counted.reduce((total, it) => total + it.word_count, 0);

        const tally = {};
        for (const it of counted) if (it.genre) tally[it.genre] = (tally[it.genre] || 0) + 1;
        const top = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];

        const graded = counted.filter(it => typeof it.grade_level === "number");
        const bits = [`${escapeHtml(words.toLocaleString())} words`];
        if (top) {
          // "mostly" has to earn itself. Four genres one story each is not
          // "mostly" anything, and saying so would be the first wrong number
          // on the page.
          const lead = top[1] * 2 >= counted.length ? "mostly" : "most often";
          bits.push(`${lead} <span class="genre">${escapeHtml(top[0])}</span>`);
        }
        if (graded.length) {
          const avg = graded.reduce((total, it) => total + it.grade_level, 0) / graded.length;
          // readingBand owns the thresholds; here we want the band on its own,
          // without the age it carries in the strip above.
          bits.push(`usually ${escapeHtml(readingBand(avg).split(",")[0])}`);
        }

        const across = skipped
          ? `Across ${counted.length} of your last ${rows.length} stories:`
          : `Across your last ${rows.length} stories:`;
        // The leading space is for copy-paste, not for the screen: the note is
        // display:block, so the browser trims it, but without it the copied
        // text reads "usually easy2 older stories have no reading stats."
        const note = skipped
          ? ` <span class="skipped">${skipped} older ${skipped === 1 ? "story has" : "stories have"} no reading stats.</span>`
          : "";
        summaryEl.innerHTML = `${across} ${bits.join(" · ")}${note}`;
      }

      if (!rows.length) {
        list.innerHTML = '<li class="empty">No stories yet.</li>';
        return;
      }
      list.innerHTML = rows.map(it => {
        // Word count and genre join the timestamp line rather than starting a
        // third one. The summary line is styled to truncate, not wrap - this is
        // read one-handed in the dark.
        const meta = [escapeHtml(it.created_at)];
        if (typeof it.word_count === "number") {
          meta.push(`${escapeHtml(String(it.word_count))} words`);
        }
        if (it.genre) meta.push(`<span class="genre">${escapeHtml(it.genre)}</span>`);
        return `
        <li><details>
          <summary>
            <span class="q">${escapeHtml(it.child_name)} — ${escapeHtml(it.theme)}</span>
            <span class="meta">${meta.join(" · ")}</span>
          </summary>
          <div class="a">${escapeHtml(it.story)}</div>
        </details></li>`;
      }).join("");
    }

    // /stories is per-user and authenticated, so there is nothing to fetch until
    // someone is signed in - and asking anyway would just be a 401.
    async function loadHistory() {
      const headers = authHeaders();
      if (!headers) return;
      try {
        const r = await fetch(`${BACKEND_URL}/stories`, {headers});
        if (r.status === 401) return handleAuthExpired(errEl);
        if (r.ok) renderHistory(await r.json());
      } catch {
        errEl.textContent =
          "Cannot reach the story server. If it was asleep, wait a moment and try again.";
      }
    }

    // --- Waiting: a silent 8 seconds reads as a hang ------------------------
    let writingTimers = [];
    function startWriting() {
      let i = 0;
      ansEl.innerHTML =
        `<div class="writing"><span id="wline">${WRITING_LINES[0]}</span>` +
        `<span class="dots"></span><span class="slow" id="wslow"></span></div>`;
      writingTimers.push(setInterval(() => {
        i = (i + 1) % WRITING_LINES.length;
        const el = $("wline"); if (el) el.textContent = WRITING_LINES[i];
      }, 3000));
      // Render's free tier sleeps; say so rather than let it look broken.
      writingTimers.push(setTimeout(() => {
        const el = $("wslow");
        if (el) el.textContent = "The server was asleep — this first one can take up to a minute.";
      }, 12000));
    }
    function stopWriting() {
      writingTimers.forEach(t => { clearInterval(t); clearTimeout(t); });
      writingTimers = [];
    }

    // `stats` defaults to empty so a story with no numbers renders exactly as it
    // did before this existed - no strip at all, rather than a row of dashes.
    function renderStory(text, stats = {}) {
      const paras = text.trim().split(/\n\s*\n/)
        .map(p => `<p>${escapeHtml(p.trim())}</p>`).join("");

      // "to read aloud" is load-bearing, not padding. The estimate is 130 words
      // a minute - a parent reading out loud, roughly half silent reading speed
      // - so a number labelled just "to read" looks wrong by a factor of two to
      // anyone who checks it against the clock.
      const bits = [];
      if (typeof stats.word_count === "number") {
        bits.push(`<span class="bit">${escapeHtml(String(stats.word_count))} words</span>`);
      }
      if (typeof stats.reading_seconds === "number") {
        bits.push(`<span class="bit">${escapeHtml(readingTime(stats.reading_seconds))} to read aloud</span>`);
      }
      if (typeof stats.grade_level === "number") {
        bits.push(`<span class="bit">${escapeHtml(readingBand(stats.grade_level))}</span>`);
      }
      if (stats.genre) {
        // The genre is a keyword heuristic, so it can look arbitrary - "Animals"
        // for a story about a boat. Holding or hovering the label shows the
        // words that chose it rather than asking anyone to take it on trust.
        const why = stats.genre_hits
          ? ` title="chosen from: ${escapeHtml(stats.genre_hits)}"`
          : "";
        bits.push(`<span class="bit genre"${why}>${escapeHtml(stats.genre)}</span>`);
      }
      const strip = bits.length
        ? `<div class="stat-strip">${bits.join(" · ")}</div>`
        : "";

      // Concatenated rather than one indented template: #answer is white-space:
      // pre-wrap, so newlines between these blocks would render as real gaps.
      ansEl.innerHTML =
        `<div class="story" id="story">${paras}</div>` + strip +
        `<div class="story-tools">
           <button type="button" id="smaller" aria-label="Smaller text">A−</button>
           <button type="button" id="bigger"  aria-label="Bigger text">A+</button>
           <button type="button" id="copy">Copy</button>
           <button type="button" id="again">Another story</button>
         </div>`;

      const setSize = d => {
        storySize = Math.min(1.7, Math.max(0.95, storySize + d));
        localStorage.setItem("storySize", storySize);
        document.documentElement.style.setProperty("--story-size", storySize + "rem");
      };
      $("bigger").onclick = () => setSize(0.1);
      $("smaller").onclick = () => setSize(-0.1);
      $("again").onclick = () => tell();
      $("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(text);
          $("copy").textContent = "Copied";
          setTimeout(() => { const c = $("copy"); if (c) c.textContent = "Copy"; }, 1500);
        } catch { $("copy").textContent = "Press and hold to copy"; }
      };

      // On a phone the story lands below the fold; take them to it.
      $("story").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function tell() {
      const child_name = nameEl.value.trim();
      const theme = themeEl.value.trim();
      errEl.textContent = "";

      // Validate here rather than after a round trip.
      if (!child_name) { errEl.textContent = "Who is the story for?"; nameEl.focus(); return; }
      if (!theme) { errEl.textContent = "Pick a suggestion, or type what it should be about."; themeEl.focus(); return; }

      const headers = authHeaders();
      if (!headers) return handleAuthExpired(errEl);

      localStorage.setItem("childName", child_name);
      btn.disabled = true;
      btn.textContent = "Writing…";
      startWriting();
      try {
        const r = await fetch(`${BACKEND_URL}/story`, {
          method: "POST",
          headers,
          body: JSON.stringify({ child_name, theme, length }),
        });
        if (r.status === 401) {
          stopWriting();
          ansEl.textContent = "";
          return handleAuthExpired(errEl);
        }
        const data = await r.json();
        // 429 and 502 arrive as {"detail": "..."} already written for a person;
        // pass them through rather than inventing our own wording.
        if (!r.ok) throw new Error(data.detail || "Request failed");
        stopWriting();
        // The stats are contracted onto the history rows, and the story just
        // written is one of them. Match on the text rather than assuming it is
        // first: the order of that list is the backend's business, and getting
        // it wrong would caption this story with another night's numbers.
        const stats = typeof data.word_count === "number"
          ? data
          : (data.history || []).find(it => it.story === data.story) || {};
        renderStory(data.story, stats);
        renderHistory(data.history);
      } catch (e) {
        stopWriting();
        ansEl.textContent = "";
        errEl.textContent = e.message === "Failed to fetch"
          ? `Cannot reach the story server. If it was asleep, wait a moment and try again.`
          : e.message;
      } finally {
        // Not plain `false`: a 401 above signed us out, and re-enabling the
        // button would offer a request that cannot succeed.
        btn.disabled = !getToken();
        btn.textContent = "Tell me a story";
      }
    }

    btn.addEventListener("click", tell);

    // --- Sign-in ------------------------------------------------------------
    const hintEl = $("auth-hint"), whoEl = $("auth-who");
    const signoutBtn = $("signout"), buttonEl = $("g-signin");

    initGoogleAuth({
      buttonEl,
      onSignIn: user => {
        whoEl.textContent = `Signed in as ${user.name || user.email}`;
        whoEl.hidden = false;
        signoutBtn.hidden = false;
        hintEl.hidden = true;
        buttonEl.hidden = true;
        btn.disabled = false;
        $("mystats-link").hidden = false;
        loadHistory();
      },
      onSignOut: () => {
        whoEl.hidden = true;
        signoutBtn.hidden = true;
        hintEl.hidden = false;
        buttonEl.hidden = false;
        btn.disabled = true;
        $("mystats-link").hidden = true;
        // The story on screen and the earlier ones belong to one family, so
        // they go when that person does.
        stopWriting();
        ansEl.textContent = "";
        renderHistory([]);
      },
    });
    signoutBtn.addEventListener("click", signOut);
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer
            onload="googleLibraryLoaded()" onerror="googleLibraryFailed()"></script>
</body>
</html>
