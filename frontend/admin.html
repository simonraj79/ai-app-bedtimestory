<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Usage">
    <title>Usage — AI Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Deliberately not linked from the hub: this is the owner's page, and the
     backend refuses it to everyone else regardless of who finds the URL. -->
<body>
    <a class="back" href="index.html">&larr; All apps</a>
    <h1>📊 Usage</h1>

    <div class="authbar">
        <div id="g-signin"></div>
        <span id="auth-hint" class="auth-hint">Sign in with Google to see usage.</span>
        <span id="auth-who" class="auth-who" hidden></span>
        <button type="button" id="signout" class="signout" hidden>Sign out</button>
    </div>

    <div id="error" role="alert"></div>

    <div id="usage" hidden>
        <div class="stats" id="totals"></div>

        <h2>Last 14 days</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Day</th><th class="num">People</th><th class="num">Sign-ins</th><th class="num">Stories</th><th class="num">Questions</th><th class="bar-h"></th></tr>
                </thead>
                <tbody id="daily"></tbody>
            </table>
        </div>

        <h2>People</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Who</th><th class="num">Sign-ins</th><th class="num">Stories</th><th class="num">Questions</th><th>Last seen</th></tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
        </div>

        <!-- Hidden until there is at least one genre row. An empty table with
             headers and nothing under them reads as a query that broke. -->
        <div id="genres-section" hidden>
            <h2>Story genres</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Genre</th><th class="num">Stories</th><th class="num">Avg words</th><th>Reading level</th></tr>
                    </thead>
                    <tbody id="genres"></tbody>
                </table>
            </div>
        </div>

        <h2>Recent activity</h2>
        <ol id="recent"><li class="empty">Nothing yet.</li></ol>
    </div>

    <!-- No inline <script> and no inline on* handler anywhere on this page, so
         /admin.html can be served without 'unsafe-inline' in script-src. See
         vercel.json. The Google library is appended by admin.js rather than
         carrying an onload="" attribute here, which would have needed the very
         directive this page is dropping.

         Both files stay at the end of <body>: admin.js reads elements by id at
         top level, so the DOM has to exist before it runs. -->
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
