services:
  - type: web
    name: ai-apps
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # Python version comes from .python-version (3.13). PYTHON_VERSION is not
    # used here: as an env var Render demands a fully qualified patch version,
    # which breaks whenever that exact patch is unavailable.
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Set in the Render dashboard - never committed.
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated origins allowed to call this API. Set to your Vercel URL
      # once the frontend is deployed, e.g. https://ai-apps.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
      # The OAuth 2.0 Web application client ID. Public - the frontend ships it
      # too - but it is what the token's `aud` claim is checked against, so a
      # stale value rejects every sign-in.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The one address allowed to read /admin/usage. Set in the dashboard so a
      # personal email address stays out of git.
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-apps-db
          property: connectionString

databases:
  # Free tier expires 30 days after creation.
  - name: ai-apps-db
    plan: free
    databaseName: ai_apps
    user: ai_apps
